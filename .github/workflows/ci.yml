name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip ply

      # Linux: build sjasmplus and a headless ZEsarUX under tools/, so the
      # emulator tests (the Z80 interpreter running every target) run as well.
      - name: Build emulator tools
        if: runner.os == 'Linux'
        run: tools/build_emu_tools.sh

      # Without this, a missing tool would just skip the emulator tests.
      - name: Check the emulator tests will run
        if: runner.os == 'Linux'
        run: >
          python -c "import sys; sys.path.insert(0, 'tests');
          import emu_harness as h;
          print('sjasmplus:', h.find_sjasmplus()); print('ZEsarUX:', h.find_zesarux());
          sys.exit(0 if h.emulator_available() else 1)"

      # Full suite. On Windows the tests that need sjasmplus use
      # tools/sjasmplus.exe and the emulator tests skip themselves; on Linux
      # everything runs.
      - name: Run test suite
        run: python tests/run_tests.py

  build-target-smoke:
    name: Compile All Targets (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip ply

      - name: Compile test.cyd for all targets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force output/ci | Out-Null
          $models = @("48k", "128k", "plus3", "mld", "mld128")
          foreach ($m in $models) {
            python src/cydc/cydc/cydc.py $m test.cyd tools/sjasmplus.exe output/ci
          }

      - name: Verify expected artifacts exist
        shell: pwsh
        run: |
          if (-not (Test-Path "output/ci/test.tap")) { throw "Missing TAP output" }
          if (-not (Test-Path "output/ci/test.dsk")) { throw "Missing DSK output" }
          if (-not (Test-Path "output/ci/test.MLD")) { throw "Missing MLD output" }
